<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Check</title>
  <meta name="description" content="A daily quiz on your own code, graded by Gemini.">
  <meta name="theme-color" content="#f4f3ef">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610112253">
</head>
<body>
  <header class="topbar">
    <a class="deck-back" id="deckBack" href="/review-deck/" title="Back to Review Deck" hidden>&larr; Review Deck</a>
    <script>try { if (sessionStorage.getItem("rd.from") || matchMedia("(display-mode: standalone)").matches) document.getElementById("deckBack").hidden = false; } catch (e) {}</script>
    <div class="brand">
      <img src="icons/logo.svg" alt="" class="brand-logo">
      <div>
        <h1>Code Check</h1>
        <p class="brand-sub" id="projectName">Quiz yourself on your own code</p>
      </div>
    </div>
    <div class="top-actions" hidden>
      <span class="pill streak" id="streak" title="Days in a row">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="flame"><path d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.2 1-3.8 2.2-5 .3 1.6 1 2.6 2 3C11 8 11.5 5 12 2Z"/></svg>
        <span id="streakNum">0</span>
      </span>
      <button class="icon-btn" id="historyBtn" title="Past days" aria-label="Past days">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5m4-1v5l3 2"/></svg>
      </button>
      <button class="pill-btn" id="replaceBtn" title="Your project changed? Upload the new folder or files">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span>Update code</span>
      </button>
      <button class="icon-btn" id="logoutBtn" title="Log out and erase everything from this browser" aria-label="Log out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
      </button>
    </div>
  </header>

  <main id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading…</p>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <dialog id="historyDialog">
    <div class="dialog-head">
      <h2>Past days</h2>
      <button class="icon-btn" id="closeHistory" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="historyList"></div>
  </dialog>

  <dialog id="fileDialog" class="file-dialog">
    <div class="fv-head">
      <span class="file-tab" id="fvName"></span>
      <span class="fv-path" id="fvPath"></span>
      <div class="fv-actions">
        <button class="icon-btn" id="closeFile" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="fv-body" id="fvBody">
      <div class="code-wrap fv-code">
        <div class="gutter" id="fvGutter"></div>
        <div class="fv-pre">
          <div class="bands" id="fvBands"></div>
          <pre><code id="fvCode"></code></pre>
        </div>
      </div>
    </div>
    <div class="fv-foot" id="fvFoot"></div>
  </dialog>

  <template id="questionTpl">
    <section class="card question">
      <div class="q-head">
        <span class="q-num"></span>
        <span class="chip q-kind"></span>
        <span class="q-score" hidden></span>
      </div>
      <p class="q-text"></p>
      <div class="answer-box">
        <textarea rows="4" placeholder="Type your answer, or click Speak and say it out loud…"></textarea>
        <div class="answer-bar">
          <button class="mic" type="button" title="Answer by voice">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm6-3a6 6 0 0 1-12 0m6 6v3"/></svg>
            <span>Speak</span>
          </button>
          <span class="hint">Ctrl + Enter to send</span>
          <button class="primary submit" type="button">Check my answer</button>
        </div>
      </div>
      <div class="feedback" hidden></div>
    </section>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dart.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/scala.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/groovy.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/elixir.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
  <script src="js/ingest.js?v=202610112253"></script>
  <script src="js/chunks.js?v=202610112253"></script>
  <script src="js/ai.js?v=202610112253"></script>
  <script src="js/quiz.js?v=202610112253"></script>
  <script src="js/app.js?v=202610112253"></script>
</body>
</html>
